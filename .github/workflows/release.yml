name: Release

# Builds the portable Windows zip and publishes a GitHub release.
# Run it by hand: Actions > Release > Run workflow.
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Leave empty. Only to pick which EARLIER release supplies Electron, Python, ffmpeg and FlareSolverr (not the version being built)"
        default: ""
        required: false
      draft:
        description: "Create the release as a draft (publish it yourself afterwards)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('electron/package.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -f "docs/release-notes/$version.md" || { echo "::error::docs/release-notes/$version.md is missing"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists. Bump electron/package.json first."; exit 1
          fi

      - name: Download the base runtime
        env:
          BASE_TAG: ${{ inputs.base_tag }}
          NEW_TAG: v${{ steps.version.outputs.version }}
        run: |
          # The base is an earlier published release; the version being built does not exist yet.
          if [ -n "$BASE_TAG" ] && [ "$BASE_TAG" != "$NEW_TAG" ] && gh release view "$BASE_TAG" >/dev/null 2>&1; then
            base="$BASE_TAG"
          else
            [ -n "$BASE_TAG" ] && echo "::warning::Release $BASE_TAG can't be the base (it is the version being built, or it does not exist). Using the newest earlier release instead."
            base=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq \
              "[.[] | select(.draft | not) | select(.tag_name != \"$NEW_TAG\") | select(any(.assets[]; .name == \"NexDrop-windows-x64.zip\"))][0].tag_name")
          fi
          [ -n "$base" ] && [ "$base" != "null" ] || { echo "::error::No earlier release has NexDrop-windows-x64.zip to build from."; exit 1; }
          echo "Base runtime from $base"
          gh release download "$base" --pattern NexDrop-windows-x64.zip --dir base

      - name: Build the portable zip
        run: sh windows/make-release.sh base/NexDrop-windows-x64.zip dist

      - name: Publish the release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/NexDrop-windows-x64.zip dist/NexDrop-source.zip dist/SHA256SUMS.txt \
            --title "NEXDROP ${{ steps.version.outputs.version }}" \
            --notes-file "docs/release-notes/${{ steps.version.outputs.version }}.md" \
            --target "$GITHUB_SHA" \
            ${{ inputs.draft && '--draft' || '' }}
